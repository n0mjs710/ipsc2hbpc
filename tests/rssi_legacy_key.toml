# parity.toml plus the retired [ipsc] rssi_encoding_new key: an existing config that still
# carries it must load, and RSSI must decode the same as without it.
[global]
log_level = "WARNING"
[ipsc]
mode = "MASTER"
bind_ip = "127.0.0.1"
bind_port = 50000
ipsc_master_id = 9999999
auth_enabled = false
rssi_encoding_new = false
keepalive_watchdog = 60
[ipsc.capabilities]
use_safe_defaults = true
[hbp]
master_ip = "127.0.0.1"
master_port = 62031
hbp_repeater_id = 3120000
passphrase = "passw0rd"
hbp_mode = "PERSISTENT"
